# خط CI كامل — بطاقة P1 (البنود 9 و10) من تقرير الفحص الشامل
# يفشل على: أي خطأ ESLint (القواعد الأربع الحرجة مفعّلة)، أي خطأ نوع TypeScript،
# أي اختبار vitest ساقط، أو فشل بناء الإنتاج standalone.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: lint + type-check + tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (lockfile مثبّت)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint (بلا إيقافات على القواعد الحرجة — F-10)
        run: bun run lint

      - name: Type check (حاجز الأنواع — F-07)
        run: bun run type-check

      - name: Tests (جلسات / تقييد سرعة / تشفير — F-11)
        run: bun run test

      - name: Build (standalone)
        run: bun run build
